<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>My PhotoBooth</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;justify-content:space-between;align-items:center;background:#111;z-index:2}
.brand{font-weight:800;font-size:18px}.small{opacity:.65;font-size:12px}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#222;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.count{font-size:110px;font-weight:900;text-shadow:0 4px 25px #000;display:none}
.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}
.flash.on{animation:flash .28s ease}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
footer{padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);background:#111}
button{border:0;border-radius:18px;padding:16px 22px;font-size:17px;font-weight:800;cursor:pointer}
.primary{width:100%;background:#fff;color:#111}
.secondary{background:#2c2c2c;color:#fff}
.row{display:flex;gap:10px}.row button{flex:1}
#result{display:none;position:absolute;inset:0;background:#111;z-index:5;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#result img{max-width:92%;max-height:75%;object-fit:contain;border-radius:12px}
#status{text-align:center;padding:8px 0;font-size:14px;opacity:.8}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">📸 MY PHOTOBOOTH</div><div class="small" id="counter">Ready</div></header>
<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <div class="overlay"><div class="count" id="count"></div></div>
  <div class="flash" id="flash"></div>
  <div id="result">
    <div id="status">Your photo is ready!</div>
    <img id="finalImg" alt="Final photobooth photo">
    <div class="row" style="width:92%;margin-top:14px">
      <button class="secondary" id="retake">Retake</button>
      <button class="primary" id="save">Save Photo</button>
    </div>
  </div>
</div>
<footer><button class="primary" id="start">START PHOTOBOOTH</button></footer>
</div>

<script>
const video=document.getElementById('video'), start=document.getElementById('start'),
count=document.getElementById('count'), flash=document.getElementById('flash'),
counter=document.getElementById('counter'), result=document.getElementById('result'),
finalImg=document.getElementById('finalImg'), save=document.getElementById('save'), retake=document.getElementById('retake');
let stream=null, shots=[], finalBlob=null;

async function openCamera(){
  if(stream) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;
  }catch(e){
    alert("Camera access is required. Please allow Camera access in Safari and try again.");
  }
}
openCamera();

function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function countdown(n){
  count.style.display='block';
  for(let i=n;i>0;i--){count.textContent=i;await wait(900)}
  count.textContent="📸"; await wait(250); count.style.display='none';
}
function takeShot(){
  const w=video.videoWidth||1280,h=video.videoHeight||720;
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.translate(w,0);x.scale(-1,1);x.drawImage(video,0,0,w,h);
  flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
  return c;
}
function makeStrip(){
  const photoW=900, photoH=Math.round(photoW*video.videoHeight/video.videoWidth);
  const gap=22, pad=45, labelH=110;
  const out=document.createElement('canvas');
  out.width=photoW*2+gap+pad*2; out.height=photoH*2+gap+pad*2+labelH;
  const x=out.getContext('2d');
  x.fillStyle="#f7f4ef";x.fillRect(0,0,out.width,out.height);
  shots.forEach((c,i)=>{
    const px=pad+(i%2)*(photoW+gap), py=pad+Math.floor(i/2)*(photoH+gap);
    x.drawImage(c,px,py,photoW,photoH);
  });
  x.fillStyle="#222";x.font="700 42px -apple-system, sans-serif";x.textAlign="center";
  x.fillText("MY PHOTOBOOTH",out.width/2,out.height-50);
  return out;
}
async function startBooth(){
  await openCamera(); if(!stream)return;
  start.disabled=true; shots=[]; result.style.display='none';
  for(let i=0;i<4;i++){
    counter.textContent=`Photo ${i+1} of 4`;
    await countdown(3);
    shots.push(takeShot());
    await wait(500);
  }
  counter.textContent="Complete!";
  const strip=makeStrip();
  finalBlob=await new Promise(r=>strip.toBlob(r,"image/jpeg",.92));
  finalImg.src=URL.createObjectURL(finalBlob);
  result.style.display='flex'; start.disabled=false;
}
start.addEventListener('click',startBooth);
retake.addEventListener('click',()=>{result.style.display='none';counter.textContent="Ready"});
save.addEventListener('click',async()=>{
  if(!finalBlob)return;
  const file=new File([finalBlob],"photobooth.jpg",{type:"image/jpeg"});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"My PhotoBooth Photo"});return}catch(e){}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(finalBlob);a.download="photobooth.jpg";a.click();
});
</script>
</body>
</html>
